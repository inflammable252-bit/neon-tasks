<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Neon Tasks</title>
</head>
<body>
    <header>
        <h1>NEON TASKS</h1>
        <div id ="header-right">
        <select name="mode-select" id="mode-select">
            <option value="dawn">Dawn</option>
            <option value="dusk">Dusk</option>
            <option value="night">Night</option>
        </select>
    </header>
    <aside id ="sidebar">
        <details id="projects-list" open>
            <summary>Projects</summary>
            <ul>
            </ul>
        </details>
        <details id="tasks-list" open>
            <summary>Tasks</summary>
            <ul>
                <li class="task"></li>
            </ul>
        </details>
        <div class="toggle-inputs-wrapper">
            <label for="adjust-toggle">Auto-adjust</label>
            <input id="adjust-toggle" class="toggle" type="checkbox" checked>
            
            <label for="drag-toggle">Drag</label>
            <input id="drag-toggle" class="toggle" type="checkbox" checked>

            <label for="theme-toggle">Random theme:</label>
            <input id="theme-toggle" class="toggle" type="checkbox" checked>
        </div>
    </aside>
    <main>
        <section id="card-wrapper"></section>
    </main>
    <nav>
        <div class="menu-buttons-wrapper">
            <img id="list-icon" class="menu-buttons" src="./images/list-ul-svgrepo-com.svg"/>
            <img id="add-icon" class="menu-buttons" src="./images/add-square-svgrepo-com.svg"/>
            <img id="settings-icon" class="menu-buttons" src="./images/settings-svgrepo-com.svg"/>
        </div>
    </nav>
    <aside class="settings">

    </aside>
    <dialog id="modal-window">
        <div id="button-wrapper"></div>
        <img id="close-modal" src="./images/close-svgrepo-com.svg" alt="Close icon" />
        <form class="modal-form"></form>
    </dialog>
</body>
</html>
